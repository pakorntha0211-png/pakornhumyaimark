<!DOCTYPE html>
<html>
<head>
    <title>เกมเดาตัวเลข</title>
</head>
<body>
    <h1>เกมเดาตัวเลข 1-100</h1>
    <input type="number" id="guess">
    <button onclick="check()">ทาย</button>
    <p id="result"></p>

    <script>
        const answer = Math.floor(Math.random() * 100) + 1;

        function check() {
            const guess = Number(document.getElementById("guess").value);

            if (guess === answer) {
                document.getElementById("result").innerText = "🎉 ถูกต้อง!";
            } else if (guess < answer) {
                document.getElementById("result").innerText = "น้อยเกินไป";
            } else {
                document.getElementById("result").innerText = "มากเกินไป";
            }
        }
    </script>
</body>
</html>
