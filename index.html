<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แนะนำตัว - ปกรณ์</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
        }

        h1 {
            color: #333;
        }

        p {
            color: #555;
            line-height: 1.8;
        }

        .social a {
            text-decoration: none;
            color: white;
            background: #007bff;
            padding: 10px 15px;
            border-radius: 8px;
            margin: 5px;
            display: inline-block;
        }

        .social a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="profile.jpg" alt="รูปโปรไฟล์">

        <h1>สวัสดีครับ ผม ปกรณ์</h1>

        <p>
            ยินดีต้อนรับสู่เว็บไซต์แนะนำตัวของผม<br>
            ผมสนใจด้านเทคโนโลยี การเขียนโปรแกรม และการพัฒนาเว็บไซต์
        </p>

        <h2>ข้อมูลส่วนตัว</h2>
        <p>
            ชื่อ: ปกรณ์<br>
            อายุ: 18 ปี<br>
            งานอดิเรก: เล่นเกม ฟังเพลง และเขียนโค้ด
        </p>

        <div class="social">
            <a href="#">Facebook</a>
            <a href="#">Instagram</a>
            <a href="#">GitHub</a>
        </div>
    </div>

</body>
</html>
